title: "[Review] "
body:
  - type: markdown
    attributes:
      value: |
        **This is the review space** — your verdict on KYSYN, for other developers deciding
        whether it is worth it. Takes about two minutes.

        Not the right place for:
        - **A bug or something broken** → open an [Issue](../../issues/new/choose) (the in-app
          Support Bundle attaches everything needed).
        - **An idea or a missing feature** → the **Ideas** category.
        - **A question** → the **Q&A** category.

  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend it?
      options:
        # Every option is quoted on purpose: bare Yes/No/On/Off/True/False are
        # BOOLEANS in YAML, and GitHub rejects a form whose options aren't strings.
        - "Yes"
        - "Yes, with caveats"
        - "Not yet"
        - "No"
    validations:
      required: true

  - type: input
    id: verdict
    attributes:
      label: Your verdict, in one line
      description: The sentence you would say to another developer. This is the line people read first.
      placeholder: "Worth it for the dependency answers alone."
    validations:
      required: true

  - type: dropdown
    id: language
    attributes:
      label: Main language of the codebase
      description: The one KYSYN was mostly working on.
      options:
        - Bash
        - C
        - C#
        - C++
        - Dart
        - Go
        - Java
        - JavaScript
        - Kotlin
        - Lua
        - Objective-C
        - PHP
        - Python
        - Ruby
        - Rust
        - Scala
        - Solidity
        - Swift
        - TypeScript
        - Zig
        - Astro / Svelte / Vue
        - Other or mixed
    validations:
      required: true

  - type: input
    id: codebase
    attributes:
      label: What did you use it on?
      description: Rough size is fine. A public repo name is even better — it lets anyone reproduce what you saw.
      placeholder: "~4,000 files, private monorepo — or: redis/redis"
    validations:
      required: false

  - type: textarea
    id: review
    attributes:
      label: Your review
      description: >-
        Be concrete — what you were doing, what it told you, what it saved you. A specific
        moment ("it listed 53 callers I would never have found by searching") is worth more
        to the next reader than any adjective.
      placeholder: "I had to change a function used all over the codebase..."
    validations:
      required: true

  - type: textarea
    id: caveats
    attributes:
      label: Anything that fell short? (optional)
      description: >-
        Where it disappointed you or where you still need your own judgement. Optional, and
        it makes your review far more useful to the person reading it. If something is
        actually broken, please open an Issue instead — it gets fixed faster there.
    validations:
      required: false

  - type: checkboxes
    id: quoting
    attributes:
      label: Quoting
      options:
        - label: You may quote this review on kysyn.dev — verbatim, with a link back to this thread.
          required: false
